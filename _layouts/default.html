<!DOCTYPE html>
<html lang="{{ site.lang | default: "pl" }}">
  {% include head.html %}

  <style>
    /* Wymuszenie stylu dla kontenera kodu */
    pre, code {
      background-color: #272822; /* Ciemne tło */
      color: #f8f8f2;            /* Jasny tekst podstawowy */
      border-radius: 5px;
    }
    
    /* Kolorowanie składni (Monokai) */
    .highlight .hll { background-color: #49483e }
    .highlight .c { color: #75715e } /* Komentarze */
    .highlight .err { color: #960050; background-color: #1e0010 }
    .highlight .k { color: #66d9ef } /* Słowa kluczowe np. def, if */
    .highlight .l { color: #ae81ff }
    .highlight .n { color: #f8f8f2 }
    .highlight .o { color: #f92672 } /* Operatory */
    .highlight .p { color: #f8f8f2 }
    .highlight .cm { color: #75715e }
    .highlight .cp { color: #75715e }
    .highlight .c1 { color: #75715e }
    .highlight .cs { color: #75715e }
    .highlight .ge { font-style: italic }
    .highlight .gs { font-weight: bold }
    .highlight .kc { color: #66d9ef }
    .highlight .kd { color: #66d9ef }
    .highlight .kn { color: #f92672 }
    .highlight .kp { color: #66d9ef }
    .highlight .kr { color: #66d9ef }
    .highlight .kt { color: #66d9ef }
    .highlight .ld { color: #e6db74 }
    .highlight .m { color: #ae81ff } /* Liczby */
    .highlight .s { color: #e6db74 } /* Stringi (napisy) */
    .highlight .na { color: #a6e22e }
    .highlight .nb { color: #f8f8f2 }
    .highlight .nc { color: #a6e22e }
    .highlight .no { color: #66d9ef }
    .highlight .nd { color: #a6e22e }
    .highlight .ni { color: #f8f8f2 }
    .highlight .ne { color: #a6e22e }
    .highlight .nf { color: #a6e22e } /* Funkcje */
    .highlight .nl { color: #f8f8f2 }
    .highlight .nn { color: #f8f8f2 }
    .highlight .nx { color: #a6e22e }
    .highlight .py { color: #f8f8f2 }
    .highlight .nt { color: #f92672 } /* Tagi HTML */
    .highlight .nv { color: #f8f8f2 }
    .highlight .ow { color: #f92672 }
    .highlight .w { color: #f8f8f2 }
    .highlight .mf { color: #ae81ff }
    .highlight .mh { color: #ae81ff }
    .highlight .mi { color: #ae81ff }
    .highlight .mo { color: #ae81ff }
    .highlight .sb { color: #e6db74 }
    .highlight .sc { color: #e6db74 }
    .highlight .sd { color: #e6db74 }
    .highlight .s2 { color: #e6db74 }
    .highlight .se { color: #ae81ff }
    .highlight .sh { color: #e6db74 }
    .highlight .si { color: #e6db74 }
    .highlight .sx { color: #e6db74 }
    .highlight .sr { color: #e6db74 }
    .highlight .s1 { color: #e6db74 }
    .highlight .ss { color: #e6db74 }
    .highlight .bp { color: #f8f8f2 }
    .highlight .vc { color: #f8f8f2 }
    .highlight .vg { color: #f8f8f2 }
    .highlight .vi { color: #f8f8f2 }
    .highlight .il { color: #ae81ff }
  </style>

  <style>
    /* Wymuś czarny kolor dla wszystkich linków */
    a, a:visited {
      color: #000000 !important;
      text-decoration: underline; /* Podkreślenie, żeby było widać, że to link */
    }

    /* Po najechaniu myszką link robi się ciemnoszary i traci podkreślenie */
    a:hover {
      color: #333333 !important;
      text-decoration: none;
    }

    /* Wyjątek dla menu i tytułu bloga - tam nie chcemy podkreślenia */
    header a, nav a, footer a {
      text-decoration: none !important;
    }
    header a:hover, nav a:hover, footer a:hover {
      text-decoration: underline !important;
    }
  </style>

  <body>
    <div style="max-width: 700px; margin: 0 auto; padding: 20px;">

      <header class="masthead" style="margin-bottom: 40px;">
        <h1 style="margin-bottom: 10px;">
          <a href="{{ "/" | relative_url }}" style="text-decoration: none; color: inherit;">{{ site.title }}</a>
        </h1>
        <nav style="border-bottom: 1px solid #eee; padding-bottom: 10px;">
          <a href="{{ "/about" | relative_url }}">Autor</a> /
          <a href="{{ "/donate" | relative_url }}">Wesprzyj</a> /
          <a href="{{ "/rodo" | relative_url }}">Polityka prywatności</a>
          
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer style="margin-top: 80px; padding-top: 20px; border-top: 1px dashed #ccc; font-size: 0.8em; color: #666;">
        <p>
          &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}.
          Treść dostępna na licencji <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pl" target="_blank">CC BY-SA 4.0</a>.
        </p>
        <p>
          Znajdź mnie na <a href="https://infosec.exchange/@to3k">Mastodonie</a>!
        </p>
        <p>Zachęcam również do subskrybowania tego bloga poprzez <a href="/feed.xml">kanał RSS</a>.</p>
      </footer>

    </div>
  </body>
</html>
